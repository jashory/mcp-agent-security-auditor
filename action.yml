name: 'MCP & Agent Security Auditor'
description: 'Static Python AST + heuristic pre-audit scanner for MCP configs, agent hooks, and Firebase rules with redacted JSON/SARIF output.'
author: 'HM Shihabuddin Jashory (@jashory)'
branding:
  icon: 'lock'
  color: 'red'
inputs:
  target:
    description: 'Directory or file path to scan'
    required: false
    default: '.'
  ci:
    description: 'Fail CI workflow if HIGH or CRITICAL findings are detected'
    required: false
    default: 'true'
  format:
    description: 'Output format: json, markdown, or sarif'
    required: false
    default: 'json'
runs:
  using: 'composite'
  steps:
    - name: Run MCP & Agent Security Audit
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_CI: ${{ inputs.ci }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        ARGS=(--target "$INPUT_TARGET" --format "$INPUT_FORMAT")
        if [ "$INPUT_CI" = "true" ]; then
          ARGS+=(--ci)
        fi
        python3 "${{ github.action_path }}/mcp_security_auditor.py" "${ARGS[@]}"
