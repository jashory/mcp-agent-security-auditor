name: Cloud CI — AST, Action CLI, Stdio MCP & Docker Container Verification

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify-scanner-and-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify AST, 13 Rules, Action Flags, SARIF, Secret Redaction & Stdio MCP
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile

          with tempfile.TemporaryDirectory() as tmp:
              vuln_py = os.path.join(tmp, "tool_server.py")
              with open(vuln_py, "w") as f:
                  f.write(
                      "import subprocess, yaml\n"
                      "FAKE_PAT = 'ghp_' + 'A'*36\n"
                      "@mcp.tool()\n"
                      "def read_user_doc(user_path):\n"
                      "    subprocess.run(user_path, shell=True)\n"
                      "    yaml.load(user_path)\n"
                      "    return open(user_path).read()\n"
                  )
              env_file = os.path.join(tmp, ".env")
              with open(env_file, "w") as f:
                  f.write("GITHUB_TOKEN=" + "ghp_" + ("A" * 36) + "\n")
              mcp_json = os.path.join(tmp, "mcp.json")
              with open(mcp_json, "w") as f:
                  json.dump({"tools": [{"name": "exec_cmd", "inputSchema": {"type": "object", "properties": {}}}]}, f)

              p = subprocess.run([sys.executable, "mcp_security_auditor.py", "--target", tmp, "--ci"], capture_output=True, text=True)
              if p.returncode != 1 or not p.stdout.strip():
                  print("STDOUT:", p.stdout)
                  print("STDERR:", p.stderr)
                  sys.exit(1)
              rep = json.loads(p.stdout)
              rule_ids = {x["rule_id"] for x in rep["findings"]}
              for expected in ("MCP_SHELL_COMMAND_INJECTION", "MCP_UNSAFE_DESERIALIZATION", "MCP_PATH_TRAVERSAL_UNCHECKED", "MCP_TOOL_SCHEMA_UNCONSTRAINED", "HARDCODED_SECRET_TOKEN"):
                  assert expected in rule_ids, f"Missing expected rule {expected} in {rule_ids}"
              assert ("ghp_" + "A"*36) not in p.stdout, "Raw secret leaked into output!"
              assert "ghp_[REDACTED]" in p.stdout, "Expected redacted placeholder missing!"

              ps = subprocess.run([sys.executable, "mcp_security_auditor.py", tmp, "--format", "sarif"], capture_output=True, text=True)
              assert ps.returncode == 0, ps.stderr
              sarif = json.loads(ps.stdout)
              assert sarif["version"] == "2.1.0"

              rpc_in = "\n".join([
                  json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05"}}),
                  json.dumps({"jsonrpc": "2.0", "method": "notifications/initialized"}),
                  json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list"}),
                  json.dumps({"jsonrpc": "2.0", "id": 3, "method": "resources/list"}),
                  json.dumps({"jsonrpc": "2.0", "id": 4, "method": "prompts/list"}),
                  json.dumps({"jsonrpc": "2.0", "id": 5, "method": "tools/call", "params": {"name": "scan_path", "arguments": {"target": tmp}}}),
              ]) + "\n"
              pm = subprocess.run([sys.executable, "mcp_security_auditor.py", "--mcp"], input=rpc_in, capture_output=True, text=True)
              assert pm.returncode == 0, pm.stderr
              lines = [json.loads(x) for x in pm.stdout.strip().splitlines()]
              assert len(lines) == 5, lines
              assert lines[0]["result"]["serverInfo"]["name"] == "mcp-agent-security-auditor"
              tool_names = {t["name"] for t in lines[1]["result"]["tools"]}
              assert {"scan_path", "list_security_rules", "remediate_path"} <= tool_names
              assert lines[2]["result"]["resources"] == []
              assert lines[3]["result"]["prompts"] == []
              scan_res = json.loads(lines[4]["result"]["content"][0]["text"])
              assert scan_res["secrets_redacted"] is True and scan_res["total_findings"] >= 5

              # Verify v2.4.1 remediate_path safety: outside-cwd blocked, inside-cwd dry_run default & .bak backup
              rpc_rem_out = "\n".join([
                  json.dumps({"jsonrpc": "2.0", "id": 10, "method": "tools/call", "params": {"name": "remediate_path", "arguments": {"target": tmp}}}),
              ]) + "\n"
              pm_out = subprocess.run([sys.executable, "mcp_security_auditor.py", "--mcp"], input=rpc_rem_out, capture_output=True, text=True)
              out_msg = json.loads(pm_out.stdout.strip().splitlines()[0])
              assert "error" in out_msg, f"Expected workspace containment error for outside-cwd tmp: {out_msg}"

              ws_sub = os.path.join(os.getcwd(), "_ci_rem_test")
              os.makedirs(ws_sub, exist_ok=True)
              try:
                  secret_f = os.path.join(ws_sub, "sample.env")
                  orig_secret = "API_TOKEN=" + "ghp_" + ("B" * 36) + "\n"
                  with open(secret_f, "w") as sf:
                      sf.write(orig_secret)
                  rpc_rem_in = "\n".join([
                      json.dumps({"jsonrpc": "2.0", "id": 11, "method": "tools/call", "params": {"name": "remediate_path", "arguments": {"target": ws_sub}}}),
                      json.dumps({"jsonrpc": "2.0", "id": 12, "method": "tools/call", "params": {"name": "remediate_path", "arguments": {"target": ws_sub, "apply": True}}}),
                  ]) + "\n"
                  pm_in = subprocess.run([sys.executable, "mcp_security_auditor.py", "--mcp"], input=rpc_rem_in, capture_output=True, text=True)
                  in_lines = [json.loads(x) for x in pm_in.stdout.strip().splitlines()]
                  dry_res = json.loads(in_lines[0]["result"]["content"][0]["text"])
                  assert dry_res["dry_run"] is True and dry_res["files_previewed"] == 1 and not os.path.exists(secret_f + ".bak")
                  app_res = json.loads(in_lines[1]["result"]["content"][0]["text"])
                  assert app_res["dry_run"] is False and app_res["files_remediated"] == 1 and os.path.exists(secret_f + ".bak")
                  assert open(secret_f + ".bak").read() == orig_secret
                  assert "ghp_[REDACTED]" in open(secret_f).read()
              finally:
                  import shutil as _sh
                  _sh.rmtree(ws_sub, ignore_errors=True)

              src_code = open("mcp_security_auditor.py", encoding="utf-8").read()
              assert "vf_gh_pages_repo" not in src_code and "8692ce6c" not in src_code
              print("PYTHON + STDIO MCP + REMEDIATE SAFETY CHECKS PASSED:", sorted(rule_ids))
          PY

      - name: Build Docker Image & Verify Live Stdio MCP Protocol Inside Container (Glama Inspector Check)
        run: |
          docker build -t mcp-agent-security-auditor:ci .
          python3 - <<'PY'
          import json, subprocess

          rpc_in = "\n".join([
              json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05"}}),
              json.dumps({"jsonrpc": "2.0", "method": "notifications/initialized"}),
              json.dumps({"jsonrpc": "2.0", "id": 2, "method": "ping"}),
              json.dumps({"jsonrpc": "2.0", "id": 3, "method": "tools/list"}),
              json.dumps({"jsonrpc": "2.0", "id": 4, "method": "tools/call", "params": {"name": "list_security_rules", "arguments": {}}}),
          ]) + "\n"
          p = subprocess.run(["docker", "run", "-i", "--rm", "mcp-agent-security-auditor:ci"], input=rpc_in, capture_output=True, text=True, timeout=30)
          assert p.returncode == 0, f"Docker MCP failed: {p.stderr}"
          lines = [json.loads(x) for x in p.stdout.strip().splitlines()]
          assert len(lines) == 4, lines
          assert lines[0]["result"]["serverInfo"]["name"] == "mcp-agent-security-auditor"
          assert lines[1]["result"] == {}
          assert len(lines[2]["result"]["tools"]) == 3
          rules = json.loads(lines[3]["result"]["content"][0]["text"])
          assert len(rules) >= 12
          print("DOCKER LIVE MCP CONTAINER VERIFICATION PASSED! Tools:", [t["name"] for t in lines[2]["result"]["tools"]])
          PY
