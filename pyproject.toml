[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent-security-auditor"
version = "2.4.1"
description = "Zero-dependency Python AST & heuristic pre-audit CLI scanner, GitHub Action, Pre-Push Auto-Healer, Agent Skill, and stdio MCP server for MCP tools, agent hooks, HTML/SPA bundles, and Firebase rules"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "HM Shihabuddin Jashory (Shihab)", email = "contact@visionflowgroup.com" }
]
keywords = ["mcp-security", "mcp-server", "claude-code", "antigravity", "static-analysis", "firebase-rules", "sarif"]
dependencies = []

[project.scripts]
mcp-security-auditor = "mcp_security_auditor:main"
mcp-security-auditor-mcp = "mcp_security_auditor:run_mcp_server"
mcp-security-auditor-install = "install:main"

[tool.setuptools]
py-modules = ["mcp_security_auditor", "install"]

[project.urls]
Homepage = "https://jashory.github.io/mcp-agent-security-auditor/"
Repository = "https://github.com/jashory/mcp-agent-security-auditor"
Issues = "https://github.com/jashory/mcp-agent-security-auditor/issues"
"Organization" = "https://visionflowgroup.com/"
